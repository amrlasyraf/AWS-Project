id: worker_bronze_ingestion
namespace: my.project

description: "Worker: Defensive extraction of partner data from RDS silos into S3 Bronze storage."

inputs:
  - id: partner_id
    type: STRING
    description: "The unique identifier for the partner (e.g. PARTNER_A)"
  - id: suffix
    type: STRING
    description: "The table suffix for this partner (e.g. _partner_b)"

variables:
  extraction_hour: "{{ now() | date('yyyy-MM-dd-HH') }}"

tasks:
  - id: extraction_loop
    type: io.kestra.core.tasks.flows.ForEach
    values: ["transactions", "users", "cards"]
    tasks:
      - id: extract_siloed_table
        type: io.kestra.plugin.jdbc.postgresql.Query
        url: "jdbc:postgresql://{{ vars.db_host }}:5432/postgres"
        username: postgres
        password: "{{ vars.db_password }}"
        # DEFENSIVE STRATEGY: Explicitly cast all columns to TEXT to prevent schema drift failure
        # This ensures Partner A and Partner B types never crash the initial ingestion.
        sql: |
          SELECT * FROM (
            SELECT 
              CAST(t.* AS TEXT) as raw_record_dummy, -- Not used, just to ensure we can cast the whole row if needed
              * 
            FROM {{ taskrun.value }}{{ inputs.suffix }} t
          ) sub;
          -- Note: In a real production scenario, we would list every column specifically:
          -- SELECT col1::TEXT, col2::TEXT... FROM table
        # Since I don't want to maintain a hardcoded list of every column that might change, 
        # I'll use a more generic approach or list them based on the Data Dictionary in SYSTEM_DESIGN.md.

        # Refined SQL for transactions (as an example of the requirement):
        # We will use a dynamic approach in Kestra or just follow the requirement for the 3 known tables.
        sql: >
          {% if taskrun.value == 'transactions' %}
            SELECT 
              transaction_id::TEXT, user_id::TEXT, card_id::TEXT, amount::TEXT, 
              status::TEXT, transaction_time::TEXT, updated_at::TEXT, use_chip::TEXT, 
              merchant_id::TEXT, merchant_name::TEXT, mcc::TEXT, risk_score::TEXT
            FROM {{ taskrun.value }}{{ inputs.suffix }}
          {% elif taskrun.value == 'users' %}
            SELECT 
              user_id::TEXT, current_age::TEXT, yearly_income::TEXT, credit_score::TEXT
            FROM {{ taskrun.value }}{{ inputs.suffix }}
          {% elif taskrun.value == 'cards' %}
            SELECT 
              card_id::TEXT, user_id::TEXT, card_brand::TEXT, credit_limit::TEXT, card_on_dark_web::TEXT
            FROM {{ taskrun.value }}{{ inputs.suffix }}
          {% endif %}
        store: true

      - id: to_parquet
        type: io.kestra.plugin.serdes.parquet.IonToParquet
        from: "{{ outputs.extract_siloed_table.uri }}"

      - id: upload_to_s3
        type: io.kestra.plugin.aws.s3.Put
        from: "{{ outputs.to_parquet.uri }}"
        bucket: "{{ vars.s3_bucket }}"
        # Partitioned by partner and hour
        key: "bronze/partner={{ inputs.partner_id }}/table={{ taskrun.value }}/hour={{ vars.extraction_hour }}/data.parquet"
