id: worker_bronze_ingestion
namespace: my.project

description: "Worker: Stateful Incremental CDC (Change Data Capture) with Defensive String Casting."

inputs:
  - id: partner_id
    type: STRING
    description: "The unique identifier for the partner (e.g. PARTNER_A)"
  - id: suffix
    type: STRING
    description: "The table suffix for this partner (e.g. _partner_b)"

variables:
  extraction_hour: "{{ now() | date('yyyy-MM-dd-HH') }}"

tasks:
  - id: extraction_loop
    type: io.kestra.core.tasks.flows.ForEach
    values: ["transactions", "users", "cards"]
    tasks:
      - id: get_watermark
        type: io.kestra.core.tasks.kv.Get
        namespace: my.project
        key: "watermark_{{ inputs.partner_id }}_{{ taskrun.value }}"
        # Default to 1970 if not found
        failureIfNotFound: false

      - id: set_default_watermark
        type: io.kestra.core.tasks.debug.Return
        format: "{{ outputs.get_watermark.value ?? '1970-01-01 00:00:00' }}"

      - id: extract_incremental
        type: io.kestra.plugin.jdbc.postgresql.Query
        url: "jdbc:postgresql://{{ vars.db_host }}:5432/postgres"
        username: postgres
        password: "{{ vars.db_password }}"
        # DEFENSIVE: All columns to TEXT + Incremental Filter
        sql: >
          {% if taskrun.value == 'transactions' %}
            SELECT 
              transaction_id::TEXT, user_id::TEXT, card_id::TEXT, amount::TEXT, 
              status::TEXT, transaction_time::TEXT, updated_at::TEXT, use_chip::TEXT, 
              merchant_id::TEXT, merchant_name::TEXT, mcc::TEXT, risk_score::TEXT
            FROM {{ taskrun.value }}{{ inputs.suffix }}
            WHERE updated_at > '{{ outputs.set_default_watermark.value }}'
          {% elif taskrun.value == 'users' %}
            SELECT 
              user_id::TEXT, current_age::TEXT, yearly_income::TEXT, credit_score::TEXT
            FROM {{ taskrun.value }}{{ inputs.suffix }}
            WHERE updated_at > '{{ outputs.set_default_watermark.value }}'
          {% elif taskrun.value == 'cards' %}
            SELECT 
              card_id::TEXT, user_id::TEXT, card_brand::TEXT, credit_limit::TEXT, card_on_dark_web::TEXT
            FROM {{ taskrun.value }}{{ inputs.suffix }}
            WHERE updated_at > '{{ outputs.set_default_watermark.value }}'
          {% endif %}
        fetchType: FETCH
        store: true

      - id: check_if_empty
        type: io.kestra.core.tasks.flows.If
        condition: "{{ outputs.extract_incremental.size > 0 }}"
        then:
          - id: to_parquet
            type: io.kestra.plugin.serdes.parquet.IonToParquet
            from: "{{ outputs.extract_incremental.uri }}"

          - id: upload_to_s3
            type: io.kestra.plugin.aws.s3.Put
            from: "{{ outputs.to_parquet.uri }}"
            bucket: "{{ vars.s3_bucket }}"
            key: "bronze/partner={{ inputs.partner_id }}/table={{ taskrun.value }}/hour={{ vars.extraction_hour }}/data.parquet"

          - id: calculate_new_watermark
            type: io.kestra.plugin.jdbc.postgresql.Query
            url: "jdbc:postgresql://{{ vars.db_host }}:5432/postgres"
            username: postgres
            password: "{{ vars.db_password }}"
            sql: "SELECT MAX(updated_at)::TEXT as max_ts FROM {{ taskrun.value }}{{ inputs.suffix }}"
            fetchType: FETCH_ONE

          - id: update_watermark
            type: io.kestra.core.tasks.kv.Set
            namespace: my.project
            key: "watermark_{{ inputs.partner_id }}_{{ taskrun.value }}"
            value: "{{ outputs.calculate_new_watermark.row.max_ts }}"
