id: lead_orchestrator
namespace: my.project

description: "Controlling flow for Project Shield-Stream multi-partner medallion architecture."

triggers:
  - id: cron_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */2 * * *" # Trigger every 2 hours as a "dumb" schedule (KV store handles state)

variables:
  # Metadata config for partners
  active_partners:
    - id: PARTNER_A
      suffix: ""
    - id: PARTNER_B
      suffix: "_partner_b"

tasks:
  - id: parallel_bronze_layer
    type: io.kestra.plugin.core.flow.ForEach
    values: "{{ vars.active_partners }}"
    concurrencyLimit: 2
    tasks:
      - id: trigger_bronze_extraction
        type: io.kestra.plugin.core.flow.Subflow
        flowId: bronze-ingestion
        namespace: my.project
        wait: true
        transmitFailed: true
        inputs:
          partner_id: "{{ taskrun.value.id }}"
          suffix: "{{ taskrun.value.suffix }}"

  - id: silver_1_cleanse
    type: io.kestra.plugin.core.flow.Subflow
    flowId: silver-clean
    namespace: my.project
    wait: true
    transmitFailed: true

  - id: silver_2_merge
    type: io.kestra.plugin.core.flow.Subflow
    flowId: silver-merge
    namespace: my.project
    wait: true
    transmitFailed: true

errors:
  - id: alert_sns
    type: io.kestra.plugin.aws.sns.Publish
    topicArn: "{{ vars.sns_topic_arn }}"
    from: "FAILED: Kestra Flow {{ flow.id }} [{{ execution.id }}]"
    message: "The flow {{ flow.id }} failed in namespace {{ flow.namespace }}. Check logs at: {{ execution.url }}"
