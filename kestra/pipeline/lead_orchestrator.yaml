id: lead_orchestrator
namespace: ewallet.layer

description: "Controlling flow for Project Shield-Stream multi-partner medallion architecture."

triggers:
  - id: cron_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */2 * * *" # Trigger every 2 hours as a "dumb" schedule (KV store handles state)

variables:
  # Monitoring ARN
  sns_topic_arn: "arn:aws:sns:ap-southeast-1:400953388228:Kestra_Alerts"
  
  # Metadata config for partners
  active_partners: ["PARTNER_A", "PARTNER_B"]

tasks:
  - id: parallel_bronze_layer
    type: io.kestra.plugin.core.flow.ForEach
    values: "{{ vars.active_partners }}"
    concurrencyLimit: 2
    tasks:
      - id: trigger_bronze_extraction
        type: io.kestra.plugin.core.flow.Subflow
        flowId: bronze-ingestion
        namespace: ewallet.layer
        wait: true
        transmitFailed: true
        inputs:
          partner_id: "{{ taskrun.value | lower }}"
          suffix: "{{ taskrun.value == 'PARTNER_B' ? '_partner_b' : '' }}"

  - id: silver_layer_parallel
    type: io.kestra.plugin.core.flow.Parallel
    tasks:
      - id: silver_transactions_flow
        type: io.kestra.plugin.core.flow.Subflow
        flowId: silver-transactions
        namespace: ewallet.layer
        wait: true
        transmitFailed: true

      - id: silver_users_flow
        type: io.kestra.plugin.core.flow.Subflow
        flowId: silver-users
        namespace: ewallet.layer
        wait: true
        transmitFailed: true

      - id: silver_cards_flow
        type: io.kestra.plugin.core.flow.Subflow
        flowId: silver-cards
        namespace: ewallet.layer
        wait: true
        transmitFailed: true

  - id: gold_layer_sequential
    type: io.kestra.plugin.core.flow.Sequential
    tasks:
      - id: gold_user_risk_profile_flow
        type: io.kestra.plugin.core.flow.Subflow
        flowId: gold-user-risk-profile
        namespace: ewallet.layer
        wait: true
        transmitFailed: true

errors:
  - id: alert_sns
    type: io.kestra.plugin.aws.sns.Publish
    accessKeyId: "{{ kv('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ kv('AWS_SECRET_ACCESS_KEY') }}"
    region: "ap-southeast-1"
    topicArn: "{{ vars.sns_topic_arn }}"
    from:
      subject: "FAILED: {{ flow.id }}"
      data: "Execution {{ execution.id }} failed."
