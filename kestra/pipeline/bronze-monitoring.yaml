id: bronze-monitoring
namespace: ewallet.layer
description: "Monitors Source to Bronze data ingestion and logs to Iceberg"

tasks:
  - id: read_registry
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    namespaceFiles:
      enabled: true
    beforeCommands:
      - pip install --quiet kestra
    script: |
      from kestra import Kestra
      import json
      
      with open('metadata/registry.json', 'r') as f:
          data = json.load(f)
          
      Kestra.outputs({'tables': data})

  - id: process_bronze_audits
    type: io.kestra.plugin.core.flow.EachSequential
    value: "{{ outputs.read_registry.vars.tables }}"
    tasks:
      - id: run_bronze_audit_logger
        type: io.kestra.plugin.scripts.python.Commands
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: python:3.11-slim
        namespaceFiles:
          enabled: true
        env:
          TASK_PAYLOAD: "{{ taskrun.value }}"
          AWS_DEFAULT_REGION: "ap-southeast-1"
          AWS_ACCESS_KEY_ID: "{{ kv('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ kv('AWS_SECRET_ACCESS_KEY') }}"
          PIPELINE_STAGE: "source_to_bronze"
          
          # Source DB Credentials mapped from your KV store
          DB_HOST: "{{ kv('SOURCE_DB_HOST') }}"
          DB_USER: "{{ kv('SOURCE_DB_USER') }}"
          DB_PASS: "{{ kv('SOURCE_DB_PASS') }}"
          
        beforeCommands:
          - apt-get update && apt-get install -y libstdc++6
          - pip install --quiet uv
          # Installed psycopg2-binary for Postgres connections. Change to PyMySQL if using MySQL.
          - uv pip install --system --quiet duckdb==1.1.3 pyarrow 'pyiceberg[glue,s3]' psycopg2-binary
        commands:
          - python scripts/bronze_audit_logger.py