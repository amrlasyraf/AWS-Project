id: silver_layer_orchestrator
namespace: ewallet.layer

tasks:
  - id: read_registry
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    namespaceFiles:
      enabled: true
    beforeCommands:
      - pip install --quiet kestra
    script: |
      from kestra import Kestra
      import json
      
      with open('metadata/registry.json', 'r') as f:
          data = json.load(f)
          
      Kestra.outputs({'tables': data})

  - id: process_all_silver_tables
    type: io.kestra.plugin.core.flow.EachParallel
    description: "Fans out parallel tasks for every table in the registry"
    value: "{{ outputs.read_registry.vars.tables }}"
    tasks:
      - id: run_universal_engine
        type: io.kestra.plugin.scripts.python.Commands
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: python:3.11-slim
        namespaceFiles:
          enabled: true
        env:
          TABLE_NAME: "{{ json(taskrun.value).table }}"
          PRIMARY_KEY: "{{ json(taskrun.value).pk }}"
          S3_SOURCE_PATH: "{{ json(taskrun.value).path }}"
          AWS_DEFAULT_REGION: "{{ secret('AWS_REGION') }}"
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_KEY') }}"
        beforeCommands:
          - apt-get update && apt-get install -y libstdc++6
          - pip install --quiet uv
          - uv pip install --system --quiet duckdb==1.1.3 pyarrow 'pyiceberg[glue,s3]'
        commands:
          - python scripts/silver_universal_engine.py