id: github_sync
namespace: amrlasyraf.system

tasks:
  - id: sync_repository
    type: io.kestra.plugin.git.Sync
    url: https://github.com/amrlasyraf/AWS-Project.git
    branch: main
    username: amrlasyraf
    password: "{{ secret('GITHUB_TOKEN') }}"
    # Point this to the folder in your repo where the .yaml flows are
    gitDirectory: kestra/