id: wallet_data_pipeline
namespace: my.project

description: Metadata-driven Multi-partner Medallion Pipeline (Scaling compliant)

variables:
  # Metadata-driven partner configuration
  # Adding PARTNER_C here will automatically trigger extraction for its tables
  partners:
    - id: PARTNER_A
      suffix: ""
    - id: PARTNER_B
      suffix: "_partner_b"
  
  # Standard tables required for the Medallion architecture
  tables: ["transactions", "users", "cards"]

tasks:
  - id: bronze_layer
    type: io.kestra.core.tasks.flows.ForEach
    values: "{{ vars.partners }}"
    concurrencyLimit: 2 # Parallel extraction per partner
    tasks:
      - id: extract_partner_tables
        type: io.kestra.core.tasks.flows.ForEach
        values: "{{ vars.tables }}"
        tasks:
          - id: query_rds
            type: io.kestra.plugin.jdbc.postgresql.Query
            url: "jdbc:postgresql://{{ vars.db_host }}:5432/postgres"
            username: postgres
            password: "{{ vars.db_password }}"
            # Dynamically resolve table name: {table_name}{suffix}
            sql: "SELECT * FROM {{ taskrun.value }}{{ parents[1].taskrun.value.suffix }}"
            store: true

          - id: to_parquet
            type: io.kestra.plugin.serdes.parquet.IonToParquet
            from: "{{ outputs.query_rds.uri }}"

          - id: upload_to_bronze
            type: io.kestra.plugin.aws.s3.Put
            from: "{{ outputs.to_parquet.uri }}"
            bucket: "{{ vars.s3_bucket }}"
            # Hive-style partitioning (partner=ID) enables zero-code discovery in DuckDB/Athena
            key: "bronze/partner={{ parents[1].taskrun.value.id }}/{{ taskrun.value }}/data.parquet"

  - id: silver_layer
    type: io.kestra.plugin.jdbc.duckdb.Query
    sql: |
      INSTALL httpfs;
      LOAD httpfs;
      SET s3_region = '{{ vars.s3_region }}';
      SET s3_access_key_id = '{{ vars.aws_access_key }}';
      SET s3_secret_access_key = '{{ vars.aws_secret_key }}';

      -- ZERO-CODE TRANSFORMATION: Adding a new partner folder in S3 is automatically picked up
      -- hive_partitioning=true injects the 'partner' column from the directory structure
      CREATE TABLE silver_unified AS
      WITH transactions_all AS (
          SELECT * FROM read_parquet('s3://{{ vars.s3_bucket }}/bronze/partner=*/transactions/*.parquet', hive_partitioning = true)
      ),
      users_all AS (
          SELECT * FROM read_parquet('s3://{{ vars.s3_bucket }}/bronze/partner=*/users/*.parquet', hive_partitioning = true)
      ),
      cards_all AS (
          SELECT * FROM read_parquet('s3://{{ vars.s3_bucket }}/bronze/partner=*/cards/*.parquet', hive_partitioning = true)
      )
      SELECT 
          t.*,
          u.current_age, u.yearly_income, u.credit_score,
          c.card_brand, c.credit_limit, c.card_on_dark_web,
          (t.amount * 4.70) as amount_myr,
          date_diff('second', t.transaction_time, t.updated_at) as processing_latency
      FROM transactions_all t
      LEFT JOIN users_all u ON t.user_id = u.user_id AND t.partner = u.partner
      LEFT JOIN cards_all c ON t.card_id = c.card_id AND t.partner = c.partner;

      COPY silver_unified TO 's3://{{ vars.s3_bucket }}/silver/unified_wallet_data/data.parquet' (FORMAT PARQUET);
