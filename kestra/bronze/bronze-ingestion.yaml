id: bronze-ingestion
namespace: my.project

description: "Worker: Stateful Incremental CDC (Change Data Capture) with Defensive String Casting."

inputs:
  - id: partner_id
    type: STRING
    description: "The unique identifier for the partner (e.g. PARTNER_A)"
  - id: suffix
    type: STRING
    description: "The table suffix for this partner (e.g. _partner_b)"

variables:
  # Monitoring ARN
  sns_topic_arn: "arn:aws:sns:ap-southeast-1:400953388228:Kestra_Alerts"
  extraction_hour: "{{ now() | date('yyyy-MM-dd-HH') }}"

tasks:
  - id: extraction_loop
    type: io.kestra.plugin.core.flow.ForEach
    values: ["transactions", "users", "cards"]
    tasks:
      - id: get_watermark
        type: io.kestra.plugin.core.kv.Get
        namespace: my.project
        key: "watermark_{{ inputs.partner_id }}_{{ taskrun.value }}"
        # Correct property for Kestra 0.15+ (kv Get)
        errorOnMissing: false

      - id: python_extract
        type: io.kestra.plugin.scripts.python.Commands
        namespaceFiles:
          enabled: true
        env:
          DB_HOST: "{{ vars.db_host }}"
          DB_PASSWORD: "{{ vars.db_password }}"
          DB_USER: "{{ vars.db_user }}"
          DB_NAME: "{{ vars.db_name }}"
        commands:
          - "python kestra/bronze/extractor.py --table {{ taskrun.value }} --partner {{ inputs.partner_id }} --watermark \"{{ outputs.get_watermark.value ?? '1970-01-01 00:00:00' }}\""
        outputFiles:
          - "extract.csv"

      - id: check_if_empty
        type: io.kestra.plugin.core.flow.If
        # Capture the value after 'NEW_WATERMARK: ' and compare to the (potentially defaulted) input watermark
        condition: "{{ (outputs.python_extract.stdOutValue | substringAfter('NEW_WATERMARK: ') | trim) != (outputs.get_watermark.value ?? '1970-01-01 00:00:00') }}"
        then:
          - id: csv_to_ion
            type: io.kestra.plugin.serdes.csv.CsvToIon
            from: "{{ outputs.python_extract.outputFiles['extract.csv'] }}"
          
          - id: to_parquet
            type: io.kestra.plugin.serdes.parquet.IonToParquet
            from: "{{ outputs.csv_to_ion.uri }}"

          - id: upload_to_s3
            type: io.kestra.plugin.aws.s3.Upload
            accessKeyId: "{{ kv('AWS_ACCESS_KEY_ID') }}"
            secretKeyId: "{{ kv('AWS_SECRET_ACCESS_KEY') }}"
            region: "ap-southeast-1"
            from: "{{ outputs.to_parquet.uri }}"
            bucket: "{{ vars.s3_bucket }}"
            key: "bronze/partner={{ inputs.partner_id }}/table={{ taskrun.value }}/hour={{ vars.extraction_hour }}/data.parquet"

          - id: update_watermark
            type: io.kestra.plugin.core.kv.Set
            namespace: my.project
            key: "watermark_{{ inputs.partner_id }}_{{ taskrun.value }}"
            value: "{{ outputs.python_extract.stdOutValue | substringAfter('NEW_WATERMARK: ') | trim }}"

errors:
  - id: alert_sns
    type: io.kestra.plugin.aws.sns.Publish
    accessKeyId: "{{ kv('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ kv('AWS_SECRET_ACCESS_KEY') }}"
    region: "ap-southeast-1"
    topicArn: "{{ vars.sns_topic_arn }}"
    from:
      subject: "FAILED: {{ flow.id }}"
      data: "Execution {{ execution.id }} failed."
