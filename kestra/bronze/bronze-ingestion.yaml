id: bronze-ingestion
namespace: ewallet.layer

description: "Worker: Stateful Incremental CDC (Change Data Capture) with Defensive String Casting."

inputs:
  - id: partner_id
    type: STRING
    description: "The unique identifier for the partner (e.g. PARTNER_A)"
  - id: suffix
    type: STRING
    description: "The table suffix for this partner (e.g. _partner_b)"

variables:
  sns_topic_arn: "arn:aws:sns:ap-southeast-1:400953388228:Kestra_Alerts"
  s3_bucket: "ewallet-storage"
  year: "{{ now() | date('yyyy') }}"
  month: "{{ now() | date('MM') }}"
  day: "{{ now() | date('dd') }}"
  hour: "{{ now() | date('HH') }}"

tasks:
  - id: extraction_loop
    type: io.kestra.plugin.core.flow.ForEach
    values: ["transactions", "users", "cards"]
    tasks:
      - id: get_watermark
        type: io.kestra.plugin.core.kv.Get
        namespace: ewallet.layer
        key: "watermark_{{ inputs.partner_id }}_{{ taskrun.value }}"
        # Correct property for Kestra 0.15+ (kv Get)
        errorOnMissing: false

      - id: python_extract
        type: io.kestra.plugin.scripts.python.Commands
        namespaceFiles:
          enabled: true
        beforeCommands:
          - pip install uv
          - uv pip install --system pandas pyarrow fastparquet boto3 psycopg2-binary
        env:
          AWS_ACCESS_KEY_ID: "{{ kv('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ kv('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: "ap-southeast-1"
        commands:
          - "python bronze/extractor.py --table {{ taskrun.value }} --partner {{ inputs.partner_id }} --watermark \"{{ outputs.get_watermark[taskrun.value].value ?? '1970-01-01 00:00:00' }}\""
        outputFiles:
          - "extract.parquet"

      - id: check_if_empty
        type: io.kestra.plugin.core.flow.If
        # Iteration-aware condition indexing
        condition: "{{ outputs.python_extract[taskrun.value].vars is defined and outputs.python_extract[taskrun.value].vars.new_watermark != (outputs.get_watermark[taskrun.value].value ?? '1970-01-01 00:00:00') }}"
        then:
          - id: upload_to_s3
            type: io.kestra.plugin.aws.s3.Upload
            accessKeyId: "{{ kv('AWS_ACCESS_KEY_ID') }}"
            secretKeyId: "{{ kv('AWS_SECRET_ACCESS_KEY') }}"
            region: "ap-southeast-1"
            from: "{{ outputs.python_extract[parents[1].taskrun.value].outputFiles['extract.parquet'] }}"
            bucket: "{{ vars.s3_bucket }}"
            key: "bronze/partner={{ inputs.partner_id }}/table={{ parents[1].taskrun.value }}/year={{ vars.year }}/month={{ vars.month }}/day={{ vars.day }}/hour={{ vars.hour }}/data.parquet"

          - id: update_watermark
            type: io.kestra.plugin.core.kv.Set
            namespace: ewallet.layer
            key: "watermark_{{ inputs.partner_id }}_{{ parents[1].taskrun.value }}"
            value: "{{ outputs.python_extract[parents[1].taskrun.value].vars.new_watermark }}"

errors:
  - id: alert_sns
    type: io.kestra.plugin.aws.sns.Publish
    accessKeyId: "{{ kv('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ kv('AWS_SECRET_ACCESS_KEY') }}"
    region: "ap-southeast-1"
    topicArn: "{{ vars.sns_topic_arn }}"
    from:
      subject: "FAILED: {{ flow.id }}"
      data: "Execution {{ execution.id }} failed."
