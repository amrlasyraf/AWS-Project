id: silver-merge
namespace: my.project

description: "Worker: Partner-Union-heavy unification across all partners."

tasks:
  - id: unify_partners
    type: io.kestra.plugin.jdbc.duckdb.Query
    sql: |
      -- Redesign: UNION ALL across all partners to create unified entities.
      -- Cross-Partner Unification logic:
      
      -- Load S3 credentials and extensions
      INSTALL httpfs;
      LOAD httpfs;
      SET s3_region = '{{ vars.s3_region }}';
      SET s3_access_key_id = '{{ vars.s3_access_key }}';
      SET s3_secret_access_key = '{{ vars.s3_secret_key }}';

      -- Unify Transactions
      COPY (
          SELECT *, partner AS partner_id 
          FROM read_parquet('s3://{{ vars.s3_bucket }}/silver/cleansed/partner=*/table=transactions/*.parquet', hive_partitioning = 1)
      ) TO 's3://{{ vars.s3_bucket }}/silver/unified/unified_transactions.parquet' (FORMAT 'PARQUET', COMPRESSION 'SNAPPY');

      -- Unify Users
      COPY (
          SELECT *, partner AS partner_id 
          FROM read_parquet('s3://{{ vars.s3_bucket }}/silver/cleansed/partner=*/table=users/*.parquet', hive_partitioning = 1)
      ) TO 's3://{{ vars.s3_bucket }}/silver/unified/unified_users.parquet' (FORMAT 'PARQUET', COMPRESSION 'SNAPPY');

      -- Unify Cards
      COPY (
          SELECT *, partner AS partner_id 
          FROM read_parquet('s3://{{ vars.s3_bucket }}/silver/cleansed/partner=*/table=cards/*.parquet', hive_partitioning = 1)
      ) TO 's3://{{ vars.s3_bucket }}/silver/unified/unified_cards.parquet' (FORMAT 'PARQUET', COMPRESSION 'SNAPPY');

errors:
  - id: alert_sns
    type: io.kestra.plugin.aws.sns.Publish
    topicArn: "{{ vars.sns_topic_arn }}"
    from: "FAILED: Kestra Flow {{ flow.id }} [{{ execution.id }}]"
    message: "The flow {{ flow.id }} failed in namespace {{ flow.namespace }}. Check logs at: {{ execution.url }}"
