id: silver-transactions
namespace: ewallet.layer

description: "Silver Layer: Merge Deduplicated and Transformed Transactions into Iceberg"

variables:
  sns_topic_arn: "arn:aws:sns:ap-southeast-1:400953388228:Kestra_Alerts"

tasks:
  - id: run_silver_transactions
    type: io.kestra.plugin.scripts.python.Commands
    # FIX 1: Use the slim image to avoid extension loading errors
    containerImage: "python:3.11-slim"
    namespaceFiles:
      enabled: true
    beforeCommands:
      # FIX 2: Install required system library
      - apt-get update && apt-get install -y libstdc++6
      - pip install --quiet uv
      # FIX 3: Remove '--prefer-binary' and pin DuckDB
      - "uv pip install --system --quiet duckdb==1.1.3 pyarrow 'pyiceberg[glue,s3]'"
    env:
      AWS_ACCESS_KEY_ID: "{{ kv('AWS_ACCESS_KEY_ID') }}"
      AWS_SECRET_ACCESS_KEY: "{{ kv('AWS_SECRET_ACCESS_KEY') }}"
      AWS_DEFAULT_REGION: "ap-southeast-1"
    commands:
      - python scripts/silver_transactions.py

errors:
  - id: alert_sns
    type: io.kestra.plugin.aws.sns.Publish
    accessKeyId: "{{ kv('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ kv('AWS_SECRET_ACCESS_KEY') }}"
    region: "ap-southeast-1"
    topicArn: "{{ vars.sns_topic_arn }}"
    from:
      subject: "FAILED: {{ flow.id }}"
      data: "Execution {{ execution.id }} failed in the Silver Layer."